
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Subway Surfers</title>

    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="4399.z.js"></script>
    <script>
        window.config = {
            loader: 'unity',
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,

            title: 'Subway Surfers: San Francisco',

            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'Build\/SanFrancisco\/SanFrancisco.json',

            fileSize: 35,
            cachedDecompressedFileSizes: {
                'SanFrancisco.asm.code.unityweb': 9077143,
                'SanFrancisco.asm.framework.unityweb': 86369,
                'SanFrancisco.asm.memory.unityweb': 951447,
                'SanFrancisco.data.unityweb': 18323917,
                'SanFrancisco.wasm.code.unityweb': 7279617,
                'SanFrancisco.wasm.framework.unityweb': 90693,
            },
        };
    </script>
</head>

<body>
    <!-- Pose Estimation Overlay UI -->
    <div id="pose-ui-container">
        <div class="video-container">
            <video id="webcam-video" autoplay playsinline muted></video>
            <canvas id="pose-canvas"></canvas>
        </div>
        <div class="predictions-container">
            <div class="pred-row">
                <span class="pred-label">Amunt</span>
                <div class="bar-track"><div id="bar-Amunt" class="bar-fill bg-amunt"></div><span class="pred-text" id="text-Amunt">0%</span></div>
            </div>
            <div class="pred-row">
                <span class="pred-label">Dreta</span>
                <div class="bar-track"><div id="bar-Dreta" class="bar-fill bg-dreta"></div><span class="pred-text" id="text-Dreta">0%</span></div>
            </div>
            <div class="pred-row">
                <span class="pred-label">Esquerra</span>
                <div class="bar-track"><div id="bar-Esquerra" class="bar-fill bg-esquerra"></div><span class="pred-text" id="text-Esquerra">0%</span></div>
            </div>
            <div class="pred-row">
                <span class="pred-label">Ajupit</span>
                <div class="bar-track"><div id="bar-Ajupit" class="bar-fill bg-ajupit"></div><span class="pred-text" id="text-Ajupit">0%</span></div>
            </div>
            <div class="pred-row">
                <span class="pred-label">Standby</span>
                <div class="bar-track"><div id="bar-Standby" class="bar-fill bg-standby"></div><span class="pred-text" id="text-Standby">0%</span></div>
            </div>
        </div>
        <div id="debug-text">Action: idle (0%)</div>
    </div>

    <!-- Load TensorFlow.js and Teachable Machine Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <!-- Load the customized UI logic -->
    <script src="pose-ui.js"></script>

    <!-- AI Model Runner loop -->
    <script src="tf-model-runner.js"></script>

    <!-- Master Loader for Unity WebGL -->
    <script src="master-loader.js"></script>

</body>


</body>

</html>
